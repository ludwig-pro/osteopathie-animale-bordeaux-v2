name: CI Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '22.13.0'
  LIGHTHOUSE_DELTA_THRESHOLD: '0.05'

jobs:
  lint_build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck application and tests
        run: yarn typecheck

      - name: Run unit tests
        run: yarn test:unit

      - name: Build
        run: yarn build

  smoke_e2e:
    name: Smoke E2E
    runs-on: ubuntu-latest
    needs: lint_build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: yarn test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  lighthouse_remote:
    name: Lighthouse (Remote)
    runs-on: ubuntu-latest
    needs: lint_build
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test Netlify Lighthouse comment parser
        if: github.event_name == 'pull_request'
        run: node --test scripts/parse-netlify-lighthouse-comment.test.js

      - name: Resolve audit URL
        id: target
        if: github.event_name != 'pull_request'
        run: |
          TARGET_URL="https://www.osteopathie-animale-bordeaux.fr"

          echo "url=$TARGET_URL" >> "$GITHUB_OUTPUT"
          echo "Resolved Lighthouse target: $TARGET_URL"

      - name: Wait for remote URL availability (max 15 minutes)
        if: github.event_name != 'pull_request'
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        run: |
          for _ in $(seq 1 90); do
            if curl --silent --fail --location "$TARGET_URL" > /dev/null; then
              echo "Remote URL is reachable: $TARGET_URL"
              exit 0
            fi
            sleep 10
          done

          echo "Timed out after 15 minutes while waiting for $TARGET_URL"
          exit 1

      - name: Read Netlify Lighthouse scores from PR comment
        if: github.event_name == 'pull_request'
        id: netlify_scores
        uses: actions/github-script@v7
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const expectedHeadSha = context.payload.pull_request?.head?.sha;

            if (
              typeof expectedHeadSha !== 'string' ||
              !/^[0-9a-f]{40}$/i.test(expectedHeadSha)
            ) {
              core.setFailed('Pull request head SHA is missing or malformed.');
              return;
            }

            const parserUrl = pathToFileURL(
              path.join(
                process.env.GITHUB_WORKSPACE,
                'scripts',
                'parse-netlify-lighthouse-comment.js'
              )
            );
            const {
              matchesPullRequestHead,
              parseNetlifyLighthouseComment,
            } = await import(parserUrl.href);

            let parsed = null;
            const loggedStaleCommentIds = new Set();
            for (let attempt = 1; attempt <= 90; attempt += 1) {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number, per_page: 100 }
              );

              const netlifyComments = comments
                .filter((c) => {
                  const login = (c.user?.login || '').toLowerCase();
                  return login === 'netlify' || login === 'netlify[bot]';
                })
                .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

              for (const comment of netlifyComments) {
                if (!comment.body) {
                  continue;
                }
                const candidate = parseNetlifyLighthouseComment(comment.body);
                if (!candidate) {
                  continue;
                }
                if (
                  matchesPullRequestHead(
                    candidate,
                    issue_number,
                    expectedHeadSha
                  )
                ) {
                  parsed = candidate;
                  break;
                }
                if (!loggedStaleCommentIds.has(comment.id)) {
                  core.info(
                    `Ignoring stale or mismatched Netlify Lighthouse comment ID ${comment.id}.`
                  );
                  loggedStaleCommentIds.add(comment.id);
                }
              }

              if (parsed) {
                core.info(
                  `Found Netlify Lighthouse scores for commit ${parsed.commitSha} on attempt ${attempt}.`
                );
                break;
              }

              core.info(`Netlify Lighthouse scores not available yet (attempt ${attempt}/90).`);
              await sleep(10000);
            }

            if (!parsed) {
              core.setFailed('Unable to find Netlify Lighthouse scores in PR comments within 15 minutes.');
              return;
            }

            core.setOutput('performance', parsed.performance);
            core.setOutput('accessibility', parsed.accessibility);
            core.setOutput('best_practices', parsed.bestPractices);
            core.setOutput('seo', parsed.seo);
            core.setOutput('preview_url', parsed.previewUrl);
            core.setOutput('deploy_log_url', parsed.deployLogUrl);
            core.setOutput('commit_sha', parsed.commitSha);
            core.info(
              `Parsed Netlify Lighthouse scores: perf=${parsed.performance}, access=${parsed.accessibility}, bp=${parsed.bestPractices}, seo=${parsed.seo}`
            );

      - name: Run remote Lighthouse collection
        if: github.event_name != 'pull_request'
        env:
          LIGHTHOUSE_TARGET_URL: ${{ steps.target.outputs.url }}
        run: |
          rm -rf .lighthouseci
          yarn lighthouse:remote

      - name: Enforce remote Lighthouse regression gate
        id: lighthouse_gate
        continue-on-error: true
        if: >-
          always() &&
          (steps.netlify_scores.outcome == 'success' || steps.target.outcome == 'success')
        env:
          EVENT_NAME: ${{ github.event_name }}
          LH_PERF: ${{ steps.netlify_scores.outputs.performance }}
          LH_ACC: ${{ steps.netlify_scores.outputs.accessibility }}
          LH_BP: ${{ steps.netlify_scores.outputs.best_practices }}
          LH_SEO: ${{ steps.netlify_scores.outputs.seo }}
          LH_PREVIEW_URL: ${{ steps.netlify_scores.outputs.preview_url }}
          LH_COMMIT_SHA: ${{ steps.netlify_scores.outputs.commit_sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [[ ! "$LH_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] ||
              [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] ||
              [ "$LH_COMMIT_SHA" != "$EXPECTED_HEAD_SHA" ]; then
              printf '%s\n' \
                '<!-- lighthouse-remote-report -->' \
                '## ❌ Lighthouse Remote Report' \
                '' \
                'Netlify Lighthouse scores were not evaluated for this run.' \
                '' \
                '- Source: netlify-pr-comment' \
                '- Detail: comment commit is missing, malformed, or does not match the current head' \
                > /tmp/lighthouse-remote-report.md
              exit 1
            fi

            if [ -z "$LH_PERF" ] || [ -z "$LH_ACC" ] || [ -z "$LH_BP" ] || [ -z "$LH_SEO" ]; then
              printf '%s\n' \
                '<!-- lighthouse-remote-report -->' \
                '## ❌ Lighthouse Remote Report' \
                '' \
                'Netlify Lighthouse scores were not available for this run.' \
                '' \
                '- Source: netlify-pr-comment' \
                '- Detail: unable to parse Netlify bot comment' \
                > /tmp/lighthouse-remote-report.md
              exit 1
            fi

            yarn ci:lighthouse:regression \
              --baseline ci/lighthouse-baselines/remote.json \
              --source netlify-pr-comment \
              --url "$LH_PREVIEW_URL" \
              --score-performance "$LH_PERF" \
              --score-accessibility "$LH_ACC" \
              --score-best-practices "$LH_BP" \
              --score-seo "$LH_SEO" \
              --summary-file /tmp/lighthouse-remote-summary.json \
              --markdown-file /tmp/lighthouse-remote-report.md
          else
            yarn ci:lighthouse:regression \
              --baseline ci/lighthouse-baselines/remote.json \
              --source lhci-production \
              --summary-file /tmp/lighthouse-remote-summary.json \
              --markdown-file /tmp/lighthouse-remote-report.md
          fi

      - name: Stage Lighthouse PR report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          if [ -f /tmp/lighthouse-remote-report.md ]; then
            cp /tmp/lighthouse-remote-report.md lighthouse-comment.md
          else
            printf '%s\n' \
              '<!-- lighthouse-remote-report -->' \
              '## ❌ Lighthouse Remote Report' \
              '' \
              'Report file not found.' \
              > lighthouse-comment.md
          fi

      - name: Upload Lighthouse PR report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-comment-body
          path: lighthouse-comment.md
          if-no-files-found: error

      - name: Fail job if regression gate failed
        if: steps.lighthouse_gate.outcome == 'failure'
        run: exit 1

      - name: Upload remote Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-remote-artifacts
          path: |
            .lighthouseci
            /tmp/lighthouse-remote-summary.json
            /tmp/lighthouse-remote-report.md
          if-no-files-found: warn

  lighthouse_comment:
    name: Publish Lighthouse PR comment
    needs: lighthouse_remote
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      (needs.lighthouse_remote.result == 'success' ||
      needs.lighthouse_remote.result == 'failure')
    permissions:
      actions: read
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Download Lighthouse PR report
        uses: actions/download-artifact@v4
        with:
          name: lighthouse-comment-body
          path: lighthouse-comment-artifact

      - name: Update PR comment with Lighthouse report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- lighthouse-remote-report -->';
            const body = fs.readFileSync(
              'lighthouse-comment-artifact/lighthouse-comment.md',
              'utf8'
            );

            if (body !== marker && !body.startsWith(`${marker}\n`)) {
              throw new Error('Lighthouse report marker is missing.');
            }

            if (Buffer.byteLength(body, 'utf8') > 60000) {
              throw new Error('Lighthouse report exceeds 60,000 UTF-8 bytes.');
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
