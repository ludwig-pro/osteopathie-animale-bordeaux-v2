name: Backoffice Quality
on:
  push:
    branches: [main]
    paths:
      - 'apps/backoffice/**'
      - 'apps/contacts-sync/**'
      - 'package.json'
      - 'yarn.lock'
      - '.prettierrc'
      - '.github/workflows/backoffice.yml'
  pull_request:
    paths:
      - 'apps/backoffice/**'
      - 'apps/contacts-sync/**'
      - 'package.json'
      - 'yarn.lock'
      - '.prettierrc'
      - '.github/workflows/backoffice.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @osteo/backoffice run check
      - run: yarn workspace @osteo/backoffice test
      - run: yarn build:backoffice
