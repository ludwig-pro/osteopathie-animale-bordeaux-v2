name: Deploy Backoffice
on:
  push:
    branches: [preview]
    paths:
      - 'apps/backoffice/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/deploy-backoffice.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare environment
        type: choice
        options: [preview, production]
        default: preview
        required: true
permissions:
  contents: read
concurrency:
  group: backoffice-${{ inputs.environment || 'preview' }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: backoffice-${{ inputs.environment || 'preview' }}
      url: ${{ inputs.environment == 'production' && 'https://admin.osteopathie-animale-bordeaux.fr' || 'https://admin-preview.osteopathie-animale-bordeaux.fr' }}
    env:
      BACKOFFICE_ENV: ${{ inputs.environment || 'preview' }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Require main for production
        if: inputs.environment == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo 'La production doit être publiée depuis main.'
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @osteo/backoffice run check
      - run: yarn workspace @osteo/backoffice test
      - name: Verify isolation, migrate and deploy
        working-directory: apps/backoffice
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BACKOFFICE_HOSTNAME: ${{ vars.BACKOFFICE_HOSTNAME }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          ACCESS_APPLICATION_ID: ${{ vars.ACCESS_APPLICATION_ID }}
          GOOGLE_IDP_ID: ${{ vars.GOOGLE_IDP_ID }}
          BACKOFFICE_D1_ID: ${{ vars.BACKOFFICE_D1_ID }}
          PREVIEW_D1_ID: ${{ vars.PREVIEW_D1_ID }}
        run: yarn deploy "$BACKOFFICE_ENV"
